<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Split a PDF into smaller PDFs right in your browser — the file never leaves your device."
    />
    <title>PDF Splitter</title>
    <script>
      // Apply the saved/system theme before first paint to avoid a light flash on dark systems.
      try {
        var t = localStorage.getItem("pdf-splitter-theme");
        var dark = t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        var l = localStorage.getItem("appLang");
        document.documentElement.lang = l === "th" ? "th" : "en";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
